name: 인스타 게시

# posts/<폴더>/post.json 이 올라오면 실행된다.
# environment "instagram" 에 승인자를 지정해 두면, 승인 버튼을 누르기 전에는 게시하지 않는다.
on:
  push:
    branches: [main]
    paths: ["posts/**/post.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험 실행 (캐러셀 컨테이너까지만 만들고 게시하지 않음)"
        type: boolean
        default: true

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: instagram
    steps:
      - uses: actions/checkout@v4

      - name: 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: python3 scripts/publish.py

      - name: 게시 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts
          if git diff --cached --quiet; then
            echo "새 게시 기록 없음"
          else
            git commit -m "게시 기록 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
